{% extends "base.html" %}
{% from "_macros.html" import flashes with context %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main class="center-page">
    <div class="card auth-card">
        <div class="card-body">
            <div class="auth-logo"><img src="https://smartcitizen.me/assets/images/smartcitizen_logo.svg" alt="Smart Citizen"></div>
            <h1>Sign in to Flows</h1>
            <p class="subtitle">Use your Smart Citizen account. Only admins and researchers can sign in.</p>
            {{ flashes() }}
            <form method="POST" action="{{ url_for('auth.login_post') }}" data-busy="Signing in…">
                <div class="field">
                    <label for="name">Username or email</label>
                    <input class="input lg" id="name" name="name" autocomplete="username" required autofocus>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input class="input lg" id="password" type="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn primary block" type="submit">Sign in</button>
            </form>
            <p class="note">Signing in can take up to 30 seconds.</p>
        </div>
    </div>
</main>
{% endblock %}
