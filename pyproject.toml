[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scflows"
version = "0.3.0"
description = "Scheduled processing of Smart Citizen data"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "smartcitizen-connector==1.5.3",
    "scdata==1.5.5",
    "celery[redis]>=5.6,<6",
    "flower>=2.0,<3",
    "flask>=3.1,<4",
    "werkzeug>=3.1,<4",
    "flask-sqlalchemy>=3.1,<4",
    "flask-login>=0.6,<0.7",
    "flask-migrate>=4,<5",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=26,<27",
    "awswrangler>=3.17,<4",
    "boto3>=1.40,<2",
    "pydantic>=2,<3",
    "requests>=2.32,<3",
    "numpy>=1.26,<2",
    "termcolor>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
# Explicit list: the docker image installs from /, where package discovery would walk the filesystem
packages = ["scflows", "scflows.tasks"]

[tool.setuptools.package-data]
scflows = ["templates/*.html", "templates/**/*.html", "static/*", "static/**/*", "migrations/*", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
