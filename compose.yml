services:

  proxy:
    image: caddy:2-alpine
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - "./scflows/public/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./scflows/public/caddy/flower_auth:/etc/caddy/flower_auth:ro"
      # Certificates and ACME account: keep across restarts
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - internal-network
    restart: always

  # Celery broker and locks. Not published: only reachable by the other services
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 3s
    volumes:
      - redis_data:/data
    networks:
      - internal-network

  # Schedules the jobs (one instance only)
  beat:
    build: ./
    env_file:
      - .env
    command: celery --app scflows.worker:app beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      - redis
      - web
    restart: unless-stopped
    stop_grace_period: 3s
    networks:
      - internal-network

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal-network

  web:
    build: ./
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # Run from / : flask --app scflows fails inside the package directory (/scflows)
    working_dir: /
    # Apply database migrations before serving
    command: sh -c "flask --app scflows db upgrade && exec gunicorn --workers 1 --timeout 120 --bind 0.0.0.0:5000 -m 007 'scflows:create_app()' --error-logfile - --access-logfile -"
    # Served through the proxy. For local use, publish 5000:5000 in a compose.override.yml
    # Healthy once migrated and serving (gunicorn starts after the migrations)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 3s
    volumes:
      - ./scflows/public:/scflows/public
    networks:
      - internal-network

  celery:
    build: ./
    command: celery --app scflows.worker:app worker -l info --autoscale=4,2
    depends_on:
      redis:
        condition: service_started
      # Processing reads blueprints, hardware and calibrations from flows (BASE_POSTPROCESSING_URL)
      web:
        condition: service_healthy
    # user: nobody
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 3s
    volumes:
      - ./scflows/public:/scflows/public
    networks:
      - internal-network

  flower:
    build: ./
    command: celery --app scflows.worker:app flower --url_prefix=flower
    depends_on:
      - celery
    user: nobody
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 3s
    # Served through the proxy (with basic auth) only
    networks:
      - internal-network

networks:
  internal-network:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
