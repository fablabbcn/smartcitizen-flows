[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scflows"
version = "0.2.0"
description = "Scheduled processing of Smart Citizen data"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "smartcitizen-connector==1.5.1",
    "scdata==1.5.1",
    "python-crontab==3.3.0",
    "celery>=5.6,<6",
    "flower>=2.0,<3",
    # scdata requires Flask~=2.2, which predates Werkzeug 3
    "flask>=2.2,<2.3",
    "werkzeug>=2.2.2,<3",
    "flask-sqlalchemy>=3.1,<4",
    "flask-login>=0.6,<0.7",
    "gunicorn>=26,<27",
    "awswrangler>=3.17,<4",
    "boto3>=1.40,<2",
    "pydantic>=2,<3",
    "requests>=2.32,<3",
    "numpy>=1.26,<2",
    "termcolor>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
# Explicit list: the docker image installs from /, where package discovery would walk the filesystem
packages = ["scflows", "scflows.tasks"]

[tool.setuptools.package-data]
scflows = ["templates/*.html", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
