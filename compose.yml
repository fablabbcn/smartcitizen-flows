services:

  proxy:
    image: caddy:2-alpine
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - "./scflows/public/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./scflows/public/caddy/flower_auth:/etc/caddy/flower_auth:ro"
      # Certificates and ACME account: keep across restarts
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - internal-network
    restart: always

  rabbitmq:
    image: rabbitmq:latest
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 3s
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - internal-network

  flows:
    build: ./
    env_file:
      - .env
    command: ["cron-entrypoint.sh"]
    depends_on:
      - celery
    volumes:
      - ./scflows/public:/scflows/public
    networks:
      - internal-network

  web:
    build: ./
    depends_on:
      - rabbitmq
    env_file:
      - .env
    command: gunicorn --workers 1 --bind 0.0.0.0:5000 -m 007 'scflows:create_app()' --error-logfile - --access-logfile -
    # healthcheck:
    #   test: "${DOCKER_HEALTHCHECK_TEST:-curl localhost:18000/healthy}"
    #   interval: "60s"
    #   timeout: "3s"
    #   start_period: "5s"
    #   retries: 3
    ports:
      - 5000:5000
    restart: unless-stopped
    stop_grace_period: 3s
    volumes:
      - ./scflows/public:/scflows/public
    networks:
      - internal-network

  celery:
    build: ./
    command: celery --app worker:app worker -l info --autoscale=4,2
    depends_on:
      - rabbitmq
    # user: nobody
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 3s
    volumes:
      - ./scflows/public:/scflows/public
    networks:
      - internal-network

  flower:
    build: ./
    command: celery flower -l info -app worker:tasks -url-prefix=flower
    depends_on:
      - celery
    user: nobody
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 3s
    volumes:
      - ./scflows/public:/scflows/public
    ports:
      - 5555:5555
    networks:
      - internal-network

networks:
  internal-network:

volumes:
  caddy_data:
  caddy_config:
